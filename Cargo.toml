[package]
name = "clipboard-yy"
version = "0.1.0"
edition = "2021"
description = "剪贴板增强工具（Rust + Slint）"

[dependencies]
slint = "1"
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
global-hotkey = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_DataExchange"] }

[build-dependencies]
slint-build = "1"

[profile.release]
strip = true
lto = true